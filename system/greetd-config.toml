# /etc/greetd/config.toml — gestor de inicio de arch-deox
# ---------------------------------------------------------------------------
# greetd es un daemon de login minimalista. Lanza "tuigreet" (una pantalla de
# login en MODO TEXTO, estilo terminal sci-fi) en la VT1 nada más arrancar.
#
# Este fichero NO lo aplica chezmoi (vive en /etc, no en tu home). Para usarlo:
#   sudo install -Dm644 ~/.local/share/chezmoi/system/greetd-config.toml /etc/greetd/config.toml
#   sudo systemctl enable greetd.service
#   (reinicia)
#
# Doc: https://man.sr.ht/~kennylevinsen/greetd/  ·  tuigreet: https://github.com/apognu/tuigreet
# ---------------------------------------------------------------------------

[terminal]
# VT (terminal virtual) donde se dibuja el login. La 1 es la de siempre.
vt = 1

[default_session]
# tuigreet = login en texto. Banderas:
#   --time              muestra reloj y fecha
#   --remember          recuerda el último usuario escrito
#   --remember-session  recuerda la última sesión elegida
#   --asterisks         muestra * al teclear la contraseña
#   --greeting          mensaje de bienvenida
#   --cmd Hyprland      sesión por defecto al pulsar Enter
# Además tuigreet lee /usr/share/wayland-sessions automáticamente: con F2/F3
# puedes elegir entre "hyprland" y "hyprland-uwsm" si algún día quieres.
command = "tuigreet --time --remember --remember-session --asterisks --greeting 'arch-deox :: bienvenido, deox' --cmd Hyprland"
# Usuario sin privilegios bajo el que corre el greeter (lo crea el paquete greetd).
user = "greeter"
