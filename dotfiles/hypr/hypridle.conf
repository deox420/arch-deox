# ~/.config/hypr/hypridle.conf — qué pasa cuando dejas el portátil quieto.
# (hypridle sigue usando su formato propio, no Lua.)
general {
    lock_cmd = pidof hyprlock || hyprlock                             # un solo bloqueo a la vez
    before_sleep_cmd = loginctl lock-session                          # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # encender pantalla al volver
}

# 2,5 min: bajar brillo.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: bloquear.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5,5 min: apagar pantalla.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 30 min: suspender (ahorra batería).
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
