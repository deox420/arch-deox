# ~/.config/kitty/kitty.conf — terminal. Colores en colores.conf (deox-tema).
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
font_size        11.5
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF Symbols Nerd Font Mono

window_padding_width 10
background_opacity   0.90
confirm_os_window_close 0
enable_audio_bell no
cursor_shape beam
cursor_trail 3
scrollback_lines 20000

# Pestañas abajo, estilo "powerline"
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

# Copiar al seleccionar (cómodo para IPs/hashes)
copy_on_select yes

# Atajos: Ctrl+Shift+T nueva pestaña, Ctrl+Shift+Enter dividir ventana
enabled_layouts splits,stack
map ctrl+shift+enter launch --location=split --cwd=current
map ctrl+shift+t     new_tab_with_cwd

include colores.conf
