# hypr-user.conf — ajustes PERSONALES de Hyprland para el portátil de deox.
# ---------------------------------------------------------------------------
# Caelestia trae SU PROPIA configuración de Hyprland. NO la sobrescribas: en su
# lugar, Caelestia deja un fichero de usuario que se carga AL FINAL (así tus
# cambios ganan). Copia el contenido de aquí a ESE fichero de usuario.
#
# Dónde va (verifícalo en tu máquina tras 'caelestia install' — la ruta puede
# cambiar entre versiones):
#     ~/.config/hypr/hyprland/user.conf      (variante habitual de Caelestia)
#   o ~/.config/hypr/custom/user.conf
# Busca en ~/.config/hypr un fichero que la config principal haga 'source ='.
# Detalle en overrides/README.md.
# ---------------------------------------------------------------------------

# --- Monitor: panel interno del portátil (Medion, 1920x1080) ---
# Sintaxis: monitor = nombre, resolución@Hz, posición, escala
monitor = eDP-1, 1920x1080@60, 0x0, 1

# --- Entorno gráfico Intel (Iris Xe) ---
# VA-API por el driver moderno de Intel (aceleración de vídeo).
env = LIBVA_DRIVER_NAME,iHD
# Cursor bajo Wayland sin parpadeos en algunas apps.
env = WLR_NO_HARDWARE_CURSORS,1

# --- Teclado en español ---
input {
    kb_layout = es
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- Tus atajos propios (ejemplos; añade/quita a gusto) ---
# $mainMod lo define Caelestia (normalmente SUPER). Si no, descomenta:
# $mainMod = SUPER
#
# bind = $mainMod, RETURN, exec, foot          # terminal
# bind = $mainMod, Q, killactive               # cerrar ventana
