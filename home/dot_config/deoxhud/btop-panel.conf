#? Config de btop SOLO para el panel deoxhud (compacta: cabe en poco alto).
#  No afecta a tu btop normal (~/.config/btop/btop.conf).

# Sin procesos NI red (son las que exigen más alto). Solo CPU + memoria:
# así btop necesita solo ~18 filas de alto y cabe en el panel superior.
shown_boxes = "cpu mem"

color_theme = "Default"
theme_background = False
truecolor = True
vim_keys = False
rounded_corners = True
graph_symbol = "braille"
update_ms = 1500

# CPU compacto
cpu_single_graph = True
show_uptime = True
check_temp = True
show_coretemp = False

# Memoria y red en formato reducido
mem_graphs = True
show_disks = False
net_auto = True
