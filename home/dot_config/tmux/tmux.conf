# ============================================================================
#  tmux.conf — arch-deox · multiplexor + tema neón (base del panel `deoxhud`)
#  Doc: https://github.com/tmux/tmux/wiki
# ============================================================================

# ---------- Básico ----------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # true color (24 bits)
set -g mouse on                              # ratón: seleccionar/redimensionar paneles
set -g history-limit 10000
set -g base-index 1                          # ventanas empiezan en 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10                       # menos lag con Vim/Neovim
set -g focus-events on

# ---------- Prefijo: Ctrl-a (más cómodo que Ctrl-b) ----------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------- Divisiones que conservan la ruta actual ----------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux recargado ✔"

# Navegar paneles con Alt+flechas (sin prefijo)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ============================================================================
#  TEMA NEÓN TRON
# ============================================================================
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#060a0c,fg=#c8f5f0"
set -g status-left-length 40
set -g status-right-length 80

# Identificador de sesión (cápsula cian)
set -g status-left "#[bg=#2de2e6,fg=#060a0c,bold]  #S #[bg=#060a0c,fg=#2de2e6]"

# Reloj + host a la derecha
set -g status-right "#[fg=#39ff14]󰍛 #{host_short} #[fg=#00b3ff]󰥔 %H:%M #[bg=#2de2e6,fg=#060a0c,bold] %d-%m "

# Ventanas
setw -g window-status-format "#[fg=#5ff4f4] #I:#W "
setw -g window-status-current-format "#[bg=#14343a,fg=#39ff14,bold] #I:#W "

# Bordes de panel (activo en cian neón)
set -g pane-border-style "fg=#14343a"
set -g pane-active-border-style "fg=#2de2e6"

# Mensajes
set -g message-style "bg=#2de2e6,fg=#060a0c,bold"

# Modo copia estilo Vim
setw -g mode-keys vi
set -g mode-style "bg=#39ff14,fg=#060a0c"
