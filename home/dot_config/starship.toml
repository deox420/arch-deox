# ============================================================================
#  starship.toml — arch-deox · prompt del día a día (neón Tron)
#  Doc: https://starship.rs/config/
# ============================================================================

# Prompt en dos líneas: info arriba, símbolo abajo (cómodo para teclear).
format = """
[](neon_cyan)\
$os\
$username\
[](bg:neon_blue fg:neon_cyan)\
$directory\
[](fg:neon_blue bg:neon_green)\
$git_branch$git_status\
[](fg:neon_green bg:surface)\
$nodejs$rust$python$lua\
[](fg:surface)\
$cmd_duration\
$line_break\
$character"""

add_newline = true

# ---------- Paleta neón coherente con kitty/Hyprland ----------
palette = "tron"

[palettes.tron]
neon_cyan  = "#2de2e6"
neon_blue  = "#00b3ff"
neon_green = "#39ff14"
surface    = "#14343a"
fg         = "#c8f5f0"
red        = "#ff5370"

[os]
disabled = false
style = "bg:neon_cyan fg:#060a0c"
[os.symbols]
Arch = "󰣇 "

[username]
show_always = true
style_user = "bg:neon_cyan fg:#060a0c"
style_root = "bg:red fg:#060a0c"
format = '[ $user ]($style)'

[directory]
style = "bg:neon_blue fg:#060a0c"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:neon_green fg:#060a0c"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:neon_green fg:#060a0c"
format = '[$all_status$ahead_behind ]($style)'

[nodejs]
symbol = " "
style = "bg:surface fg:neon_green"
format = '[ $symbol($version) ]($style)'

[rust]
symbol = " "
style = "bg:surface fg:neon_cyan"
format = '[ $symbol($version) ]($style)'

[python]
symbol = " "
style = "bg:surface fg:neon_cyan"
format = '[ $symbol($version) ]($style)'

[lua]
symbol = " "
style = "bg:surface fg:neon_blue"
format = '[ $symbol($version) ]($style)'

[cmd_duration]
min_time = 500
style = "fg:#ffd166"
format = '[  $duration ]($style)'

[character]
success_symbol = "[](bold neon_cyan)"
error_symbol = "[](bold red)"
vimcmd_symbol = "[](bold neon_green)"
