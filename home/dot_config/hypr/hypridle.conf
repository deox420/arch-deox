# hypridle.conf — gestión de inactividad (arch-deox)
# Doc: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Tiempos pensados para un portátil. Requiere: hyprlock, brightnessctl.

general {
    lock_cmd = pidof hyprlock || hyprlock        # evita lanzar hyprlock dos veces
    before_sleep_cmd = loginctl lock-session     # bloquear antes de suspender
    after_sleep_cmd = hyprctl dispatch dpms on   # encender pantalla al despertar
}

# A los 4 min: atenuar el brillo (lo restaura al volver).
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# A los 5 min: bloquear la pantalla.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# A los 6 min: apagar la pantalla (DPMS).
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# A los 15 min: suspender el equipo.
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
