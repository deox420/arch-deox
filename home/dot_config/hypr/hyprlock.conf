# hyprlock.conf — pantalla de bloqueo (arch-deox) · Catppuccin Mocha + neón
# Doc: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# Fondo: el wallpaper con desenfoque + capa oscura Catppuccin.
background {
    monitor =
    path = /usr/share/hypr/wall1.png
    blur_passes = 3
    blur_size = 7
    color = rgba(1e1e2eff)
}

# Campo de contraseña con borde neón cian.
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(89dcebee)
    inner_color = rgba(313244ff)
    font_color = rgba(cdd6f4ff)
    fade_on_empty = false
    placeholder_text = <i>Contraseña…</i>
    fail_text = <i>Incorrecta ($ATTEMPTS)</i>
    position = 0, -20
    halign = center
    valign = center
}

# Reloj grande (cian neón).
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(89dcebff)
    font_size = 90
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Fecha en español.
label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=es_ES.UTF-8 date +'%A, %d de %B')"
    color = rgba(cdd6f4ff)
    font_size = 22
    font_family = $font
    position = 0, 75
    halign = center
    valign = center
}

# Usuario (teal).
label {
    monitor =
    text = 󰣇  $USER
    color = rgba(94e2d5ff)
    font_size = 16
    font_family = $font
    position = 0, -95
    halign = center
    valign = center
}
