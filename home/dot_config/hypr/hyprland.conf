################################################################################
##  hyprland.conf — arch-deox  ·  Catppuccin Mocha + neón Tron (sci-fi / eDEX)
##  Teclado: español (es)  ·  Portátil Medion (Intel Iris Xe, eDP-1 1920x1080)
##  Formato hyprlang (.conf). Doc: https://wiki.hypr.land/Configuring/
##  Se recarga al guardar; o manualmente con `hyprctl reload`.
##
##  NOTA: se usa .conf (y NO Lua) porque en Hyprland 0.55.2 el modo Lua rompe
##  el IPC clásico (clic en Waybar, dispatch exec/exit, scripts externos…).
##  En .conf todo el ecosistema funciona con normalidad.
################################################################################

#################
### MONITORES ###
#################
# Portátil. Si conectas pantalla externa, añade otra línea o usa `hyprctl monitors`.
monitor = eDP-1, 1920x1080@60, 0x0, 1
# Regla de respaldo: cualquier monitor desconocido se autoconfigura.
monitor = , preferred, auto, auto


###################
### MIS PROGRAMAS ###
###################
$terminal    = kitty
$fileManager = thunar
$menu        = rofi -show drun
$mainMod     = SUPER


#############################
### VARIABLES DE ENTORNO ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb     # apps Qt en Wayland nativo
env = MOZ_ENABLE_WAYLAND,1            # Firefox en Wayland


#################
### AUTOSTART ###
#################
# Se ejecuta una vez al arrancar Hyprland.
exec-once = waybar       # barra superior
exec-once = mako         # notificaciones
exec-once = hyprpaper    # fondo de pantalla
exec-once = hypridle     # bloqueo/apagado por inactividad


#####################
### ASPECTO Y TACTO ###
#####################
general {
    gaps_in     = 8     # separación entre ventanas
    gaps_out    = 16    # separación con el borde de pantalla
    border_size = 3
    # Borde de la ventana ACTIVA: degradado neón cian → teal (Tron).
    col.active_border   = rgba(89dcebee) rgba(94e2d5ee) rgba(74c7ecee) 45deg
    # Ventanas INACTIVAS: gris azulado tenue (Catppuccin surface0).
    col.inactive_border = rgba(313244aa)
    layout        = dwindle   # mosaico (alternativa: "master")
    allow_tearing = false
}

decoration {
    rounding         = 12     # esquinas redondeadas
    active_opacity   = 1.0
    inactive_opacity = 0.93   # ventanas de fondo algo translúcidas

    # Desenfoque tras ventanas translúcidas → look "cristal".
    blur {
        enabled           = true
        size              = 7
        passes            = 3
        new_optimizations = true
        ignore_opacity    = true
        xray              = false
    }

    # Sombra con tinte neón cian (formato rgba RRGGBBAA).
    shadow {
        enabled        = true
        range          = 24
        render_power   = 3
        color          = rgba(89dcebcc)   # cian, alpha cc
        color_inactive = rgba(11111baa)   # casi negro, alpha aa
    }
}

input {
    kb_layout    = es      # TECLADO ESPAÑOL
    follow_mouse = 1       # el foco sigue al ratón
    sensitivity  = 0       # -1.0 a 1.0 (0 = sin aceleración)
    repeat_delay = 300     # ms antes de repetir tecla
    repeat_rate  = 40      # repeticiones/seg
    touchpad {
        natural_scroll       = true   # scroll "natural"
        tap-to-click         = true   # tocar = clic
        disable_while_typing = true
    }
}

dwindle {
    preserve_split = true   # conserva orientación al cerrar ventanas
}

master {
    new_status = master
}

# Gesto: desliza 3 dedos en horizontal para cambiar de workspace.
gesture = 3, horizontal, workspace


###############################################
### ANIMACIONES (sci-fi: marcadas y fluidas) ###
###############################################
animations {
    enabled = true
    # Curvas bezier personalizadas (la "física" de cada animación).
    bezier = wind,      0.05, 0.9,  0.1,  1.05
    bezier = overshot,  0.13, 0.99, 0.29, 1.1
    bezier = smoothOut, 0.36, 0,    0.66, -0.56

    animation = windows,    1, 5, overshot,  slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = border,     1, 8, wind
    animation = fade,       1, 6, default
    animation = workspaces, 1, 5, overshot,  slidevert
}


#########################
### ATAJOS DE TECLADO ###
#########################
# Apps y sistema
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,                  # salir de Hyprland
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,                # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, F, fullscreen,
bind = $mainMod SHIFT, L, exec, hyprlock   # bloquear pantalla

# Foco entre ventanas (flechas)
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Mover ventanas dentro del mosaico (SHIFT + flechas)
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Redimensionar la ventana activa (CTRL + flechas). Mantén pulsado para seguir.
binde = $mainMod CTRL, right, resizeactive,  40 0
binde = $mainMod CTRL, left,  resizeactive, -40 0
binde = $mainMod CTRL, down,  resizeactive,  0 40
binde = $mainMod CTRL, up,    resizeactive,  0 -40

# Workspaces 1-10 (ir al escritorio)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Enviar la ventana actual a un escritorio (SHIFT + número)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace especial (scratchpad / "cajón")
bind = $mainMod, S,       togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Cambiar de workspace con la rueda del ratón
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Mover/redimensionar ventanas con SUPER + arrastrar
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Capturas de pantalla (grim + slurp + wl-clipboard)
bind = , Print,      exec, grim -g "$(slurp)" - | wl-copy                       # región → portapapeles
bind = SHIFT, Print, exec, grim ~/Imágenes/captura-$(date +%Y%m%d-%H%M%S).png   # pantalla completa

# Teclas multimedia: VOLUMEN (pamixer)
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl  = , XF86AudioMute,        exec, pamixer -t
bindl  = , XF86AudioMicMute,     exec, pamixer --default-source -t

# Teclas multimedia: BRILLO (brightnessctl)
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Teclas multimedia: REPRODUCCIÓN (playerctl)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous


#########################
### REGLAS DE VENTANA ###
#########################
# NOTA (Hyprland 0.55.2): el parser hyprlang (.conf) tiene DEPRECADAS las
# `windowrule` y fallan con cualquier sintaxis ("invalid field float"). Por eso
# se dejan fuera de momento. Eran extras menores (que pavucontrol/PiP floten).
# Cuando una versión futura las arregle en .conf —o si se vuelve a Lua— se
# reañaden así (sintaxis de referencia):
#   windowrule = float, class:^(pavucontrol)$
#   windowrule = float, title:^(Picture-in-Picture)$
#   windowrule = pin,   title:^(Picture-in-Picture)$
