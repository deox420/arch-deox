# ==========================================================================
# Hyprland — config base (arch-deox). Tema: Catppuccin Mocha.
# Doc: https://wiki.hyprland.org/Configuring/
# Ajusta monitores, teclado y atajos a tu gusto.
# ==========================================================================

# --- Monitores -------------------------------------------------------------
# "preferred" usa la resolución/refresco recomendados. Lista los tuyos con:
#   hyprctl monitors
monitor = ,preferred,auto,1

# --- Programas por defecto -------------------------------------------------
$terminal = kitty
$menu     = rofi -show drun
$browser  = firefox

# --- Autostart -------------------------------------------------------------
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
# Portales (captura de pantalla, file pickers) para Wayland:
exec-once = /usr/lib/xdg-desktop-portal-hyprland

# --- Entorno ---------------------------------------------------------------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

# --- Entrada ---------------------------------------------------------------
input {
    kb_layout = es
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# --- Estética (Catppuccin Mocha) -------------------------------------------
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# --- Atajos ----------------------------------------------------------------
$mod = SUPER

bind = $mod, RETURN, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, E, exec, thunar
bind = $mod, V, togglefloating,
bind = $mod, D, exec, $menu
bind = $mod, F, fullscreen,
bind = $mod, B, exec, $browser
# Lanzador de pentest por categoría (Rofi). Solo uso autorizado.
bind = $mod SHIFT, P, exec, ~/.local/bin/rofi-pentest.sh

# Mover foco
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces 1-10
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Mover ventana a workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mover/redimensionar con ratón
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Capturas (requiere grim + slurp)
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Multimedia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
