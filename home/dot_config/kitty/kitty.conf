# ============================================================================
#  kitty.conf — arch-deox · terminal del día a día
#  Paleta NEÓN TRON / eDEX (cian-verde sobre negro profundo). Legible y usable.
#  Doc: https://sw.kovidgoyal.net/kitty/conf/
# ============================================================================

# ---------- Fuente ----------
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
# Activa ligaduras de Fira/JetBrains (==, =>, !=) salvo bajo el cursor:
disable_ligatures cursor

# ---------- Ventana ----------
background_opacity      0.90
dynamic_background_opacity yes
window_padding_width    10
confirm_os_window_close 0
hide_window_decorations yes
# Permite blur del compositor (Hyprland) detrás de la terminal:
# (Hyprland aplica el blur; aquí solo dejamos transparencia.)

# ---------- Cursor (barra neón cian, parpadeo suave) ----------
cursor              #2de2e6
cursor_text_color   #0b0f10
cursor_shape        beam
cursor_blink_interval 0.5

# ---------- Scrollback ----------
scrollback_lines    10000

# ---------- Campana ----------
enable_audio_bell   no
visual_bell_duration 0.0

# ============================================================================
#  PALETA "Tron neón" — fondo casi negro con tinte teal, acentos cian/verde
# ============================================================================
foreground          #c8f5f0
background          #060a0c
selection_foreground #060a0c
selection_background #2de2e6

# URLs subrayadas en cian al pasar el ratón
url_color           #39ffd0
url_style           curly

# Bordes de paneles (kitty splits)
active_border_color   #2de2e6
inactive_border_color #14343a

# --- 16 colores ANSI ---
# negro / gris
color0  #0b0f10
color8  #2a4a4f
# rojo (alertas) — coral neón para que no rompa la armonía
color1  #ff5370
color9  #ff7a93
# verde neón (eje Tron)
color2  #39ff14
color10 #6bffb0
# amarillo / ámbar
color3  #ffd166
color11 #ffe29a
# azul cian eléctrico
color4  #00b3ff
color12 #41dfff
# magenta / violeta
color5  #c792ea
color13 #e0b0ff
# cian (acento principal)
color6  #2de2e6
color14 #5ff4f4
# blanco
color7  #c8f5f0
color15 #ffffff

# ---------- Pestañas ----------
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #060a0c
active_tab_background    #2de2e6
inactive_tab_foreground #5ff4f4
inactive_tab_background #0b1416

# ---------- Copiar / pegar (también con teclado, sin ratón) ----------
# Al seleccionar texto (Shift+arrastrar) se copia solo al portapapeles.
copy_on_select          clipboard
# COPIAR POR TECLADO: Ctrl+Shift+Y marca cada línea con una letra; pulsas la
# letra de la línea que quieras y se copia al portapapeles (ideal para comandos).
map ctrl+shift+y        kitten hints --type line --program @
# Recargar esta config sin reiniciar kitty:
map ctrl+shift+f5       load_config_file

# ---------- Atajos útiles ----------
map ctrl+shift+enter    new_window
map ctrl+shift+t        new_tab
map ctrl+shift+l        next_layout
# Subir/bajar opacidad en caliente:
map ctrl+shift+a>m      set_background_opacity +0.05
map ctrl+shift+a>l      set_background_opacity -0.05
